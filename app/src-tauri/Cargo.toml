[package]
name = "selfglance"
version = "0.1.0"
description = "SelfGlance: Bond, a desktop guide that shows you the next click. Runs on your laptop."
authors = ["Bashanta Tiwari"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "selfglance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
user-idle = "0.6.0"
tauri-plugin-global-shortcut = "2.4.0"
active-win-pos-rs = "0.11.0"
base64 = "0.23.1"
xcap = "0.9.8"
tauri-plugin-autostart = "2.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-single-instance = "2"
enigo = "0.6.1"
sysinfo = "0.39.6"
arboard = "3.6.1"
trash = "5.2.9"
chrono = "0.4.45"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.2", features = ["sync", "time"] }
sherpa-onnx = "1.13.8"
cpal = "0.18.2"
bzip2 = "0.6.1"
tar = "0.4.46"
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# A panic ends the task it happened in and is written to bond.log, not the whole app (it used to abort the process silently).
panic = "unwind"
strip = true

# Dependencies (screenshot capture, image resize/encode, HTTP) are compiled optimized even
# in dev builds, so the companion stays smooth while an answer is being prepared.
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Security_Credentials"] }
uiautomation = "0.25.1"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization"] }
