[package]
name = "selfglance"
version = "0.1.0"
description = "SelfGlance - a 3D desktop companion"
authors = ["Bashanta Tiwari"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "selfglance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
user-idle = "0.6.0"
tauri-plugin-global-shortcut = "2.4.0"
active-win-pos-rs = "0.11.0"
base64 = "0.23.1"
xcap = "0.9.8"
tauri-plugin-autostart = "2.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-single-instance = "2"
enigo = "0.6.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies (screenshot capture, image resize/encode, HTTP) are compiled optimized even
# in dev builds, so the companion stays smooth while an answer is being prepared.
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
