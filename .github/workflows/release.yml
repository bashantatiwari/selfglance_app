# Builds the SelfGlance installer for Windows on GitHub's machines.
# Push a tag like `v0.1.0` (or run it manually from the Actions tab) and a draft GitHub Release
# appears with the .msi and .exe installers. Windows only for now: screen reading, window control
# and the local brain are Windows-specific, so macOS and Linux builds would be half an app.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci

      # Don't ship what the tests say is broken.
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "SelfGlance v__VERSION__"
          releaseBody: "Windows installers below. Unsigned for now, so Windows SmartScreen may ask you to confirm."
          releaseDraft: true
          prerelease: false
